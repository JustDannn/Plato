name: plato

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plato}
      POSTGRES_USER: ${POSTGRES_USER:-plato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plato_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - plato_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-plato}:${POSTGRES_PASSWORD:-plato_dev_password}@db:5432/${POSTGRES_DB:-plato}
      JWT_SECRET: ${JWT_SECRET:-plato_dev_secret_change_me_0123456789}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      # Kode di-mount agar perubahan langsung dimuat ulang tanpa rebuild image.
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:8080/api/v1/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  plato_db_data:
